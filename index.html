<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WellPass by Deepen</title>
<meta name="description" content="WellPass — a Deepen benefit. Discounts at partner businesses for DeepenWell users." />
<meta name="theme-color" content="#1A1140" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1A1140;
    --navy-deep: #100B2E;
    --surface: #241A5C;
    --surface-2: #2E2172;
    --line: #43349B;
    --text: #F3F0FB;
    --muted: #B3A8E0;
    --accent: #A855F7;
    --accent-dim: rgba(168,85,247,0.16);
    --danger: #FF5A72;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--navy);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
  }
  ::selection{ background: var(--accent); color: #fff; }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .sr-only{ position:absolute; width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
  .display{ font-family:'Inter', sans-serif; font-weight:800; letter-spacing:-0.02em; }
  .mono{ font-family:'Inter', sans-serif; }

  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- NAV ---------- */
  .nav{
    position: sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding: 16px 32px;
    background: rgba(16,11,46,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:10px; font-size:20px; }
  .logo .wordwrap{ display:flex; flex-direction:column; line-height:1.1; }
  .logo .by{ font-size:10.5px; font-weight:600; letter-spacing:.04em; color: var(--muted); }
  .logo .mark{
    width:30px;height:30px;border-radius:9px;
    background: var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Inter',sans-serif; font-weight:800; font-size:15px;
  }
  .logo .word{ font-family:'Inter',sans-serif; font-weight:800; letter-spacing:-0.02em; color: var(--text); }
  .logo .word span{ color: var(--accent); }
  .nav-right{ display:flex; align-items:center; gap:10px; }
  .navtabs{ display:flex; gap:4px; background: var(--surface-2); padding:4px; border-radius:10px; }
  .langswitch{ display:flex; gap:2px; background: var(--surface-2); padding:4px; border-radius:10px; }
  .langswitch button{
    border:none; background:transparent; color:var(--muted);
    padding:7px 10px; border-radius:7px; font-weight:700; font-size:11.5px; letter-spacing:.3px;
    transition: all .15s ease;
  }
  .langswitch button.active{ background: var(--accent); color:#fff; }
  .langswitch button:not(.active):hover{ color: var(--text); }
  .navtabs button{
    border:none; background:transparent; color:var(--muted);
    padding:9px 18px; border-radius:7px; font-weight:600; font-size:14px;
    transition: all .18s ease;
  }
  .navtabs button.active{ background: var(--accent); color: #fff; }
  .navtabs button:not(.active):hover{ color: var(--text); }

  /* ---------- HERO ---------- */
  .hero{
    padding: 64px 32px 36px;
    max-width: 1180px; margin:0 auto;
    text-align:left;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    color: var(--accent); font-size:13px; font-weight:700;
    letter-spacing:.3px;
    margin-bottom:16px;
    background: var(--accent-dim);
    padding: 6px 12px 6px 10px; border-radius:999px;
  }
  .eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .hero h1{
    font-size: clamp(36px, 5.5vw, 60px);
    font-weight:800; letter-spacing:-0.02em;
    line-height: 1.05;
    margin: 0 0 16px;
  }
  .hero h1 em{ color: var(--accent); font-style:normal; }
  .hero p{
    color: var(--muted); font-size:16px; max-width:560px; line-height:1.6; margin:0;
  }

  /* ---------- TIER COMPARE TABLE ---------- */
  .compare-wrap{ max-width:1180px; margin: 28px auto 0; padding: 0 32px; }
  .compare-title{ font-size:20px; font-weight:800; letter-spacing:-0.01em; margin: 0 0 14px; }
  .compare-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:16px; }
  .compare-table{ width:100%; border-collapse:collapse; min-width:640px; background: var(--surface); }
  .compare-table th, .compare-table td{
    padding:14px 18px; text-align:center; border-bottom:1px solid var(--line);
  }
  .compare-table .rowlabel{ text-align:left; color: var(--muted); font-size:13px; font-weight:600; white-space:nowrap; }
  .compare-table thead th{ vertical-align:top; border-bottom:1px solid var(--line); background: var(--surface-2); }
  .compare-table thead th.mine{ background: var(--accent-dim); }
  .col-name{ font-weight:800; font-size:16px; letter-spacing:-0.01em; }
  .col-how{ color: var(--muted); font-size:11.5px; margin-top:4px; line-height:1.4; min-height:30px; }
  .col-select{
    margin-top:10px; width:100%; background: transparent; border:1px solid var(--line); color: var(--text);
    padding:7px 10px; border-radius:8px; font-size:12.5px; font-weight:700;
  }
  .col-select:hover{ border-color: var(--accent); color: var(--accent); }
  .col-select.current{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .compare-table tbody td.mine{ background: var(--accent-dim); }
  .compare-table tbody tr:last-child td{ border-bottom:none; }
  .yes{ color: var(--accent); font-weight:800; }
  .no{ color: var(--line); }
  @media (max-width: 620px){ .compare-table th, .compare-table td{ padding:12px 12px; } }

  /* ---------- FILTER BAR ---------- */
  .filterbar{
    position: sticky; top:65px; z-index:30;
    background: rgba(26,17,64,0.92); backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
    margin-top:40px;
  }
  .filterbar-inner{
    max-width:1180px; margin:0 auto; padding: 14px 32px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .search{
    flex: 1 1 220px; position:relative;
  }
  .search input{
    width:100%; background: var(--surface); border:1px solid var(--line);
    color: var(--text); padding: 11px 14px 11px 38px; border-radius:10px;
    font-size:14px; outline:none; transition: border-color .15s;
  }
  .search input:focus{ border-color: var(--accent); }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.45; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--line); background: var(--surface); color: var(--muted);
    padding: 9px 14px; border-radius: 999px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:6px; transition: all .15s;
  }
  .chip:hover{ border-color: var(--accent); color: var(--text); }
  .chip.active{ background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .cityselect{
    background: var(--surface); border:1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius:10px; font-size:13px; font-weight:600; outline:none;
  }

  /* ---------- GRID ---------- */
  .grid-wrap{ max-width:1180px; margin:0 auto; padding: 28px 32px 80px; }
  .count{ color: var(--muted); font-size:13px; margin-bottom:18px; }
  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:16px;
  }
  @media (max-width: 900px){ .grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    transition: transform .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column; gap:14px;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 30px -14px rgba(168,85,247,0.3);
  }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .deepen-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10.5px; font-weight:700; letter-spacing:.02em;
    color: var(--accent); background: var(--accent-dim);
    border-radius:999px;
    padding:3px 9px; width:fit-content; margin-top:8px;
  }
  .cat-icon{
    width:40px; height:40px; border-radius:12px; background: var(--surface-2);
    display:flex; align-items:center; justify-content:center; color: var(--accent); flex-shrink:0;
    font-weight:700;
  }
  .cat-icon.logo-icon{ padding:0; overflow:hidden; position:relative; }
  .cat-icon.logo-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .logo-fallback{
    display:none; position:absolute; inset:0; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px;
  }
  .tier-chip{
    font-size:10.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .tier-chip.classic{ background: var(--surface-2); color: var(--muted); }
  .tier-chip.coach{ background: transparent; border:1px solid var(--line); color: var(--text); }
  .tier-chip.elite{ background: transparent; border:1px solid var(--accent); color: var(--accent); }
  .tier-chip.active{ background: var(--accent); color: #fff; }

  .biz-name{ font-size:17px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .biz-meta{ color: var(--muted); font-size:13px; display:flex; gap:6px; align-items:center; }
  .biz-extra{ color: var(--muted); font-size:11.5px; display:flex; gap:12px; flex-wrap:wrap; }
  .biz-links{ display:flex; gap:14px; }
  .biz-links a{ font-size:11.5px; color: var(--accent); text-decoration:none; font-weight:700; display:flex; align-items:center; gap:4px; }
  .biz-links a:hover{ text-decoration:underline; }

  .loadmore-wrap{ display:flex; justify-content:center; margin-top:26px; }
  .loadmore-wrap .btn{ width:auto; padding:11px 26px; }

  .skeleton-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
  @media (max-width: 900px){ .skeleton-grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px){ .skeleton-grid{ grid-template-columns: 1fr; } }
  .skeleton-card{
    background: var(--surface); border:1px solid var(--line); border-radius:18px;
    height:200px; position:relative; overflow:hidden;
  }
  .skeleton-card::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(124,58,237,0.06), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer{ from{ transform:translateX(-100%);} to{ transform:translateX(100%);} }

  .discount-block{
    display:flex; align-items:baseline; gap:8px; margin-top:2px;
    border-top: 1px solid var(--line); padding-top:14px;
  }
  .discount-num{ font-weight:800; font-size:32px; color: var(--accent); line-height:1; letter-spacing:-0.02em; }
  .discount-label{ font-size:11px; color: var(--muted); letter-spacing:.5px; text-transform:uppercase; font-weight:700; }

  .redeem{ font-size:12.5px; color: var(--muted); line-height:1.4; }

  .empty{
    text-align:center; padding: 80px 20px; color: var(--muted);
  }
  .empty .display{ font-size:24px; color: var(--text); margin-bottom:8px; }

  /* ---------- ABOUT PAGE ---------- */
  .about-wrap{ max-width:1180px; margin:0 auto; padding: 0 32px 80px; }
  .about-stats{ display:flex; gap:14px; margin: 8px 0 44px; flex-wrap:wrap; }
  .stat{ background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 24px; min-width:120px; }
  .stat-num{ font-size:26px; font-weight:800; color: var(--accent); letter-spacing:-0.02em; }
  .stat-label{ color: var(--muted); font-size:12px; margin-top:2px; }
  .about-section{ margin-top:52px; }
  .about-section h2{ font-size:22px; font-weight:800; letter-spacing:-0.01em; margin: 0 0 18px; }
  .steps{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
  @media (max-width: 780px){ .steps{ grid-template-columns: 1fr; } }
  .step{ background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .step-num{
    width:28px;height:28px; border-radius:8px; background: var(--accent-dim); color: var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; margin-bottom:12px;
  }
  .step-title{ font-weight:700; font-size:14.5px; margin-bottom:6px; }
  .step-desc{ color: var(--muted); font-size:12.5px; line-height:1.5; }
  .cat-grid{ display:grid; grid-template-columns: repeat(5,1fr); gap:12px; }
  @media (max-width: 780px){ .cat-grid{ grid-template-columns: repeat(2,1fr); } }
  .cat-tile{
    background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px;
    display:flex; flex-direction:column; align-items:center; gap:8px; color: var(--accent);
  }
  .cat-tile span{ color: var(--text); font-size:12.5px; font-weight:600; }
  .faq{ display:flex; flex-direction:column; gap:10px; }
  .faq-item{ background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .faq-q{ font-weight:700; font-size:14px; margin-bottom:6px; }
  .faq-a{ color: var(--muted); font-size:13px; line-height:1.5; }

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--line); padding: 26px 32px; text-align:center;
    color: var(--muted); font-size:12.5px;
  }

  /* ---------- ADMIN ---------- */
  .admin-wrap{ max-width: 1100px; margin: 0 auto; padding: 52px 32px 80px; }
  .gate{
    max-width: 380px; margin: 90px auto; text-align:center;
    background: var(--surface); border:1px solid var(--line); border-radius:20px; padding: 40px 32px;
  }
  .gate .lock{ width:46px;height:46px; border-radius:14px; background:var(--accent-dim); color:var(--accent);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 18px; }
  .gate h2{ margin: 0 0 6px; font-size:22px; font-weight:800; }
  .gate p{ color: var(--muted); font-size:13px; margin: 0 0 22px; }
  .gate input{
    width:100%; background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:10px; text-align:center; font-size:15px; letter-spacing:2px; outline:none; margin-bottom:12px;
  }
  .gate input:focus{ border-color: var(--accent); }
  .btn{
    width:100%; background: var(--accent); color: #fff; border:none;
    padding:12px 14px; border-radius:10px; font-weight:700; font-size:14px;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn.secondary{ background: var(--surface); border:1px solid var(--line); color: var(--text); }
  .btn.danger{ background: var(--danger); color: #fff; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .gate .hint{ margin-top:16px; font-size:11px; color: var(--muted); }
  .err{ color: var(--danger); font-size:12.5px; margin: -6px 0 12px; }

  .admin-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .admin-head h2{ margin:0; font-size:26px; font-weight:800; }
  .admin-head p{ margin:4px 0 0; color: var(--muted); font-size:13px; }
  .admin-toolbar{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn.small{ width:auto; padding:9px 16px; font-size:12.5px; display:flex; align-items:center; gap:6px; }
  .lastupdated{ color: var(--muted); font-size:11.5px; margin-top:4px; }


  .table-wrap{ background: var(--surface); border:1px solid var(--line); border-radius:16px; overflow-x:auto; overflow-y:hidden; }
  .table-wrap table{ min-width:640px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; padding:13px 16px; color: var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--line); background: var(--surface-2); }
  td{ padding:13px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .rowbtns{ display:flex; gap:8px; }
  .iconbtn{
    background: var(--surface-2); border:1px solid var(--line); color: var(--muted);
    width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{ color: var(--text); border-color: var(--accent); }
  .iconbtn.del:hover{ color: var(--danger); border-color: var(--danger); }

  .modal-overlay{
    position:fixed; inset:0; background: rgba(6,5,26,0.7); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background: var(--surface); border:1px solid var(--line); border-radius:18px;
    padding: 28px; width:100%; max-width:460px;
  }
  .modal h3{ margin:0 0 20px; font-size:19px; font-weight:800; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color: var(--muted); font-weight:600; margin-bottom:6px; }
  .field input, .field select{
    width:100%; background: var(--surface-2); border:1px solid var(--line); color: var(--text);
    padding:10px 12px; border-radius:9px; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus{ border-color: var(--accent); }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .modal-actions{ display:flex; gap:10px; margin-top: 22px; }
  .confirm-modal .confirm-msg{ color: var(--muted); font-size:13.5px; line-height:1.5; margin:0; }

  .addbtn{ display:flex; align-items:center; gap:8px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--accent); color: #fff; padding: 12px 22px;
    border-radius: 999px; font-weight:700; font-size:13.5px; z-index:200;
    box-shadow: 0 10px 30px -8px rgba(168,85,247,0.5);
    animation: rise .25s ease;
  }
  @keyframes rise{ from{ opacity:0; transform: translate(-50%, 10px);} to{ opacity:1; transform: translate(-50%,0);} }

  .loading{ text-align:center; padding:80px 20px; color: var(--muted); }
  .spin{ width:26px;height:26px; border-radius:50%; border:2.5px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="logo">
    <div class="mark">W</div>
    <div class="wordwrap">
      <div class="word">WELL<span>PASS</span></div>
      <div class="by" id="byLabel">By Deepen</div>
    </div>
  </div>
  <div class="nav-right">
    <div class="navtabs" role="tablist" aria-label="Site sections">
      <button id="tab-directory" class="active" role="tab" aria-selected="true"></button>
      <button id="tab-about" role="tab" aria-selected="false"></button>
      <button id="tab-admin" role="tab" aria-selected="false"></button>
    </div>
    <div class="langswitch" id="langSwitch" role="group" aria-label="Language">
      <button data-lang="en">EN</button>
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
    </div>
  </div>
</nav>

<main id="app"></main>

<footer id="siteFooter">WellPass — a Deepen benefit.</footer>

<script>
(function(){

  var CATEGORIES = [
    { id: 'gyms', key: 'catGyms', icon: iconDumbbell },
    { id: 'sport', key: 'catSport', icon: iconSneaker },
    { id: 'food', key: 'catFood', icon: iconChef },
    { id: 'wellness', key: 'catWellness', icon: iconLeaf },
    { id: 'apparel', key: 'catApparel', icon: iconBag }
  ];

  // Single source of truth for the tier ladder — update here only.
  // Requirements are NOT cumulative by product ownership: Elite is an "or", Active (top) is an "and".
  var TIERS = {
    classic: { label: 'Classic', order: 0, howKey: 'howClassic', discount: '15%', directory: true, priority: false, events: false },
    coach:   { label: 'Coach',   order: 1, howKey: 'howCoach', discount: '20%', directory: true, priority: false, events: false },
    elite:   { label: 'Elite',   order: 2, howKey: 'howElite', discount: '25%', directory: true, priority: true, events: false },
    active:  { label: 'Active',  order: 3, howKey: 'howActive', discount: '30%', directory: true, priority: true, events: true }
  };

  var STORAGE_KEY = 'wellpass:businesses:v5';
  var ADMIN_CODE = 'DEEPEN2026';

  var state = {
    tab: 'directory',
    lang: 'en', // 'en'|'ru'|'uz'
    businesses: null, // null = loading
    lastUpdated: null,
    search: '',
    category: 'all',
    city: 'all',
    sort: 'tier',
    myTier: null, // 'classic'|'coach'|'elite'|'active'|null
    visibleCount: 9,
    unlocked: false,
    passInput: '',
    passError: '',
    failedAttempts: 0,
    lockedUntil: 0,
    modal: null, // {mode:'add'|'edit', data:{}}
    confirmDialog: null, // {title, message, onYes}

  // ---------------- STORAGE ADAPTER ----------------
  // window.storage only exists inside a Claude artifact. If this file is ever
  // hosted as a standalone site, fall back to localStorage so it keeps working
  // (as a single-browser cache) instead of breaking. Swap this adapter for real
  // API calls to your backend when you move off the Claude prototype.
  var hasArtifactStorage = (typeof window.storage !== 'undefined');
  var storageAdapter = {
    get: async function(key){
      if(hasArtifactStorage){
        try{ var r = await window.storage.get(key, true); return r ? r.value : null; }
        catch(e){ return null; }
      }
      try{ return window.localStorage.getItem(key); } catch(e){ return null; }
    },
    set: async function(key, value){
      if(hasArtifactStorage){
        try{ await window.storage.set(key, value, true); return true; }
        catch(e){ return false; }
      }
      try{ window.localStorage.setItem(key, value); return true; } catch(e){ return false; }
    }
  };
  var LOCAL_KEY = 'wellpass:mytier'; // per-user, never shared

  function hashColor(str){
    var hash = 0;
    for(var i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
    var hue = Math.abs(hash) % 360;
    return 'hsl('+hue+', 62%, 42%)';
  }
  function initials(name){
    var words = name.trim().split(/\s+/).filter(function(w){ return /[A-Za-z0-9\u00C0-\u024F\u0400-\u04FF]/.test(w); });
    return ((words[0]||'')[0]||'').toUpperCase() + ((words[1]||'')[0]||'').toUpperCase();
  }
  function mapsUrl(name, city, address){
    var q = address ? (name + ', ' + address) : (name + ' ' + city);
    return 'https://www.google.com/maps/search/' + encodeURIComponent(q);
  }
  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

      var parsed = raw ? JSON.parse(raw) : null;
      state.businesses = parsed && parsed.businesses ? parsed.businesses : null;
      state.lastUpdated = parsed ? parsed.lastUpdated : null;
    } catch(e){
      state.businesses = null;

    if(!state.businesses || !state.businesses.length){
      state.businesses = SEED.slice();
      await saveBusinesses();

    try{
      var myTierRaw = await storageAdapter.get(LOCAL_KEY);
      if(myTierRaw && TIERS[myTierRaw]) state.myTier = myTierRaw;

    try{

      if(q && b.name.toLowerCase().indexOf(q) === -1) return false;

    if(state.sort === 'discount'){

      html += renderModal();
    }
    if(state.confirmDialog){
      html += renderConfirmDialog();
    }

    return html;
  }

  function askConfirm(title, message, onYes){
    state.confirmDialog = { title: title, message: message, onYes: onYes };
    render();
  }

  function renderConfirmDialog(){
    var c = state.confirmDialog;
    return '' +
    '<div class="modal-overlay" id="confirmOverlay">' +
    '  <div class="modal confirm-modal">' +
    '    <h3>'+c.title+'</h3>' +
    '    <p class="confirm-msg">'+c.message+'</p>' +
    '    <div class="modal-actions">' +
    '      <button class="btn secondary" id="confirmNo" style="width:auto; flex:1;">'+t('cancel')+'</button>' +
    '      <button class="btn danger" id="confirmYes" style="width:auto; flex:1;">'+t('confirmBtn')+'</button>' +
    '    </div>' +
    '  </div>' +
    '</div>';
  }

  function renderModal(){
    var isEdit = state.modal.mode === 'edit';
    var d = state.modal.data;
    var catOptions = CATEGORIES.map(function(c){
      return '<option value="'+c.id+'"'+(d.category===c.id?' selected':'')+'>'+t(c.key)+'</option>';
    }).join('');
    var tierOptions = Object.keys(TIERS).map(function(tid){
      return '<option value="'+tid+'"'+(d.tier===tid?' selected':'')+'>'+TIERS[tid].label+'</option>';
    }).join('');

    return '' +
    '<div class="modal-overlay" id="modalOverlay">' +
    '  <div class="modal">' +
    '    <h3>'+(isEdit ? t('editBusinessTitle') : t('addBusinessTitle'))+'</h3>' +
    '    <div class="field"><label>'+t('fieldName')+'</label><input id="f_name" type="text" value="'+escapeHtml(d.name||'')+'" placeholder="e.g. FitZone Gym" /></div>' +
    '    <div class="field-row">' +
    '      <div class="field"><label>'+t('fieldCategory')+'</label><select id="f_category">'+catOptions+'</select></div>' +
    '      <div class="field"><label>'+t('fieldCity')+'</label><input id="f_city" type="text" value="'+escapeHtml(d.city||'')+'" placeholder="e.g. Tashkent" /></div>' +
    '    </div>' +
    '    <div class="field-row">' +
    '      <div class="field"><label>'+t('fieldDiscount')+'</label><input id="f_discount" type="number" min="0" max="100" value="'+(d.discount!==undefined?d.discount:'')+'" placeholder="25" /></div>' +
    '      <div class="field"><label>'+t('fieldTier')+'</label><select id="f_tier">'+tierOptions+'</select></div>' +
    '    </div>' +
    '    <div class="field"><label>'+t('fieldRedeem')+'</label><input id="f_redeem" type="text" value="'+escapeHtml(d.redeem||'')+'" placeholder="'+escapeHtml(t('placeholderRedeem'))+'" /></div>' +
    '    <div class="field"><label>'+t('fieldAddress')+'</label><input id="f_address" type="text" value="'+escapeHtml(d.address||'')+'" placeholder="'+escapeHtml(t('placeholderAddress'))+'" /></div>' +
    '    <div class="field"><label>'+t('fieldLogoUrl')+'</label><input id="f_logoUrl" type="url" value="'+escapeHtml(d.logoUrl||'')+'" placeholder="https://…" /></div>' +
    '    <div class="field-row">' +
    '      <div class="field"><label>'+t('fieldHours')+'</label><input id="f_hours" type="text" value="'+escapeHtml(d.hours||'')+'" placeholder="'+escapeHtml(t('placeholderHours'))+'" /></div>' +
    '      <div class="field"><label>'+t('fieldPhone')+'</label><input id="f_phone" type="text" value="'+escapeHtml(d.phone||'')+'" placeholder="'+escapeHtml(t('placeholderPhone'))+'" /></div>' +
    '    </div>' +
    (state.modal.error ? '<div class="err" role="alert">'+state.modal.error+'</div>' : '') +
    '    <div class="modal-actions">' +
    '      <button class="btn secondary" id="modalCancel" style="width:auto; flex:1;">'+t('cancel')+'</button>' +
    '      <button class="btn" id="modalSave" style="width:auto; flex:1;">'+(isEdit?t('save'):t('addBusiness'))+'</button>' +
    '    </div>' +
    '  </div>' +
    '</div>';
  }

  function wireAdmin(){
    if(!state.unlocked){
      var input = document.getElementById('passInput');
      var btn = document.getElementById('unlockBtn');
      if(input && !input.disabled){
        input.addEventListener('input', function(e){ state.passInput = e.target.value; });
        input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
      }
      if(btn && !btn.disabled){ btn.addEventListener('click', tryUnlock); }
      if(Date.now() < state.lockedUntil){
        setTimeout(function(){ if(state.tab==='admin') render(); }, 1000);
      }
      return;
    }

    var addBtn = document.getElementById('addBizBtn');
    if(addBtn){ addBtn.addEventListener('click', function(){
      state.modal = { mode:'add', data:{ category:'gyms', tier:'classic' }, error:'' };
      render();
    }); }

    var exportBtn = document.getElementById('exportBtn');
    if(exportBtn){ exportBtn.addEventListener('click', function(){
      var blob = new Blob([JSON.stringify(state.businesses, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'wellpass-businesses.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported businesses.json');
    }); }

    var importInput = document.getElementById('importInput');
    if(importInput){ importInput.addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var parsed = JSON.parse(reader.result);
          if(!Array.isArray(parsed)) throw new Error('not an array');
          var valid = parsed.every(function(b){ return b && b.name && b.category && b.city && typeof b.discount==='number' && TIERS[b.tier]; });
          if(!valid) throw new Error('bad shape');
          var oldCount = state.businesses.length, newCount = parsed.length;
          askConfirm(
            t('confirmReplaceTitle'),
            t('confirmReplaceMsg').replace('{n}', oldCount).replace('{m}', newCount),
            function(){
              state.businesses = parsed;
              saveBusinesses();
              render();
              showToast('Imported '+parsed.length+' businesses');
            }
          );
        } catch(err){
          showToast(t('invalidImportFile'));
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    }); }

    document.querySelectorAll('[data-edit]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = Number(el.getAttribute('data-edit'));
        var biz = state.businesses.filter(function(b){return b.id===id;})[0];
        state.modal = { mode:'edit', data: Object.assign({}, biz), error:'' };
        render();
      });
    });

    document.querySelectorAll('[data-del]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = Number(el.getAttribute('data-del'));
        var biz = state.businesses.filter(function(b){return b.id===id;})[0];
        if(!biz) return;
        askConfirm(
          t('confirmDeleteTitle'),
          t('confirmDeleteMsg').replace('{name}', biz.name),
          function(){
            state.businesses = state.businesses.filter(function(b){return b.id!==id;});
            saveBusinesses();
            render();
            showToast('Removed '+biz.name);
          }
        );
      });
    });

    if(state.modal){
      var overlay = document.getElementById('modalOverlay');
      var modalBox = overlay.querySelector('.modal');
      overlay.addEventListener('click', function(e){ if(e.target===overlay){ state.modal=null; render(); } });
      document.getElementById('modalCancel').addEventListener('click', function(){ state.modal=null; render(); });

      var firstField = document.getElementById('f_name');
      if(firstField){ firstField.focus(); }

      function getFocusable(){
        return Array.prototype.slice.call(modalBox.querySelectorAll('input, select, button')).filter(function(el){ return !el.disabled; });
      }
      modalBox.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
          e.stopPropagation();
          state.modal = null;
          render();
          return;
        }
        if(e.key === 'Tab'){
          var focusable = getFocusable();
          if(!focusable.length) return;
          var first = focusable[0], last = focusable[focusable.length-1];
          if(e.shiftKey && document.activeElement === first){
            e.preventDefault(); last.focus();
          } else if(!e.shiftKey && document.activeElement === last){
            e.preventDefault(); first.focus();
          }
        }
      });
      document.getElementById('modalSave').addEventListener('click', function(){
        var name = document.getElementById('f_name').value.trim();
        var category = document.getElementById('f_category').value;
        var city = document.getElementById('f_city').value.trim();
        var discount = Number(document.getElementById('f_discount').value);
        var tier = document.getElementById('f_tier').value;
        var redeem = document.getElementById('f_redeem').value.trim();
        var address = document.getElementById('f_address').value.trim();
        var logoUrl = document.getElementById('f_logoUrl').value.trim();
        var hours = document.getElementById('f_hours').value.trim();
        var phone = document.getElementById('f_phone').value.trim();

        if(!name || !city || !redeem || isNaN(discount) || discount < 0 || discount > 100){
          state.modal.error = t('fillEveryField');
          render();
          return;
        }

        if(state.modal.mode === 'add'){
          var maxId = state.businesses.reduce(function(m,b){return Math.max(m,b.id);}, 0);
          state.businesses.push({ id: maxId+1, name:name, category:category, city:city, discount:discount, tier:tier, redeem:redeem, address:address, logoUrl:logoUrl, hours:hours, phone:phone });
          showToast('Added '+name);
        } else {
          var idx = state.businesses.findIndex(function(b){return b.id===state.modal.data.id;});
          state.businesses[idx] = Object.assign({}, state.modal.data, { name:name, category:category, city:city, discount:discount, tier:tier, redeem:redeem, address:address, logoUrl:logoUrl, hours:hours, phone:phone });
          showToast('Saved '+name);
        }
        saveBusinesses();
        state.modal = null;
        render();
      });
    }

    if(state.confirmDialog){
      var confirmOverlay = document.getElementById('confirmOverlay');
      var closeConfirm = function(){ state.confirmDialog = null; render(); };
      confirmOverlay.addEventListener('click', function(e){ if(e.target===confirmOverlay){ closeConfirm(); } });
      confirmOverlay.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeConfirm(); } });
      document.getElementById('confirmNo').addEventListener('click', closeConfirm);
      document.getElementById('confirmYes').addEventListener('click', function(){
        var onYes = state.confirmDialog.onYes;
        state.confirmDialog = null;
        if(onYes) onYes();
      });
      var confirmYesBtn = document.getElementById('confirmYes');
      if(confirmYesBtn){ confirmYesBtn.focus(); }
    }
  }

  function tryUnlock(){
    if(Date.now() < state.lockedUntil) return;
    if(state.passInput === ADMIN_CODE){
      state.unlocked = true;
      state.passError = '';
      state.failedAttempts = 0;
    } else {
      state.failedAttempts++;
      if(state.failedAttempts >= 5){
        state.lockedUntil = Date.now() + 30000;
        state.failedAttempts = 0;
        state.passError = t('tooManyAttempts');
      } else {
        state.passError = t('incorrectPass');
      }
    }
    render();
  }

  // ---------------- ICONS ----------------
  function iconDumbbell(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>'; }

  function iconLeaf(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 3 17 3s2 5-1 8c-.8.8-3 2-3 2v7"/></svg>'; }
  function iconBag(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>'; }
  function iconPin(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>'; }
  function iconLock(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'; }
  function iconPlus(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function iconEdit(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'; }
  function iconTrash(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'; }
  function iconExport(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 21h16"/></svg>'; }
  function iconImport(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>'; }

  loadBusinesses();
})();
</script>
